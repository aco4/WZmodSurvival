<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WZ2100 Templates Editor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0f0f0f;
  --bg2:      #161616;
  --border:   #262626;
  --border2:  #333;
  --muted:    #7d7d7d;
  --text:     #e4e4e4;
  --ln-col:   #4f4f4f;
  --lh:       22px;
  --vpad:     10px;
  --gw:       68px;
  --c-ok:     #29e0b4;
  --c-err:    #ff5555;
  --c-cmt:    #6a9955;
  --c-hl:     rgba(255,255,255,.055);
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

/* ── Tabs ── */
.tabs {
  display: flex; flex-shrink: 0; user-select: none;
  background: var(--bg2); border-bottom: 1px solid var(--border2);
}
.tab {
  padding: 5px 16px; cursor: pointer;
  font-family: inherit; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); background: none; border: none;
  border-right: 1px solid var(--border);
  border-bottom: 2px solid transparent;
  display: flex; align-items: center; gap: 7px;
  transition: color .1s, background .1s;
}
.tab:hover { color: #c8c8c8; background: rgba(255,255,255,.05); }
.tab.active { color: #fff; background: var(--bg); border-bottom-color: var(--c-ok); }
.tab-badge { font-size: 11px; letter-spacing: 0; color: #5a5a5a; text-transform: none; }
.tab.active .tab-badge { color: var(--muted); }
.tab-badge.ok  { color: #199e80; }
.tab.active .tab-badge.ok { color: var(--c-ok); }
.tab-badge.err { color: #b03838; }
.tab.active .tab-badge.err { color: var(--c-err); }

/* ── Workspace ── */
.workspace { flex: 1; display: flex; overflow: hidden; }
.pane { flex: 1; display: none; overflow: hidden; }
.pane.active { display: flex; }

/* ── Editor ── */
.editor-wrap { flex: 1; display: flex; overflow: hidden; position: relative; }

.gutter-outer {
  width: var(--gw); flex-shrink: 0; overflow: hidden;
  background: var(--bg2); border-right: 1px solid var(--border);
  position: relative;
}
#gc { padding-top: var(--vpad); will-change: transform; }

.gl {
  height: var(--lh);
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 8px; gap: 5px;
  font-size: 11px; color: var(--ln-col);
  user-select: none;
}
.gl.active { background: var(--c-hl); }
.gl.active .gnum { color: #e4e4e4; }
.gdot {
  width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
  background: transparent; transition: background .12s;
}
.gl.err .gdot { background: var(--c-err); }

.ta-wrap { flex: 1; position: relative; overflow: hidden; }

/* Text metrics shared by the textarea and the mirror behind it. These MUST stay
   identical — every one of them shifts glyph positions, and the caret lives in
   one element while the colours live in the other. One rule, two selectors, so
   they cannot drift apart. */
#ta, .ml {
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 13px;
  font-weight: 400;
  font-variant-ligatures: none;
  letter-spacing: normal;
  word-spacing: normal;
  line-height: var(--lh);
  tab-size: 4;
  white-space: pre;
}

/* Same padding on both, so their coordinate systems share an origin. */
#ta, #mirror { padding: var(--vpad) 24px var(--vpad) 14px; }

#ta {
  position: absolute; inset: 0;
  background: transparent;
  border: none; outline: none;
  color: transparent;                  /* hide native text; the mirror shows it */
  caret-color: #d4d4d4;
  resize: none;
  overflow: auto;
  /* Past the scroll limits the browser rubber-bands this element's contents —
     caret and selection with them — while clamping scrollTop, so no scroll
     event fires and the mirror and gutter have nothing to follow. There is no
     value to read during the bounce, so suppress the bounce. */
  overscroll-behavior: none;
  word-wrap: normal;
  z-index: 2;
}
#ta::selection { background: rgba(90,140,220,.35); color: transparent; }

#mirror {
  position: absolute; top: 0; left: 0;
  pointer-events: none; user-select: none;
  will-change: transform;
  z-index: 1;
}

/* Caret-line band. Deliberately not part of the mirror: it spans the pane
   rather than the text, so it must not travel with the horizontal scroll. */
#hl {
  position: absolute; left: 0; right: 0; top: 0; height: var(--lh);
  background: var(--c-hl);
  pointer-events: none;
  will-change: transform;
  z-index: 0;
}
.ml { height: var(--lh); }

/* Token colours */
.t-punct   { color: #9a9a9a; }
.t-key     { color: #4fc1ff; }
.t-id      { color: #f5d76e; }
.t-null    { color: #c586ff; }
.t-frame   { color: #7a7a7a; }
.t-slash   { color: #6a9955; }
.t-comment { color: #7fb069; }
.t-err     { color: #ff6b6b; }

/* Derived name / error message, appended after the line's real text. It sits in
   normal flow, so nothing has to measure where the line ended — render() only
   has to say how many columns of gap put it in the shared trailer column. */
.trailer          { margin-left: 3ch; }
.trailer.ok       { color: var(--c-ok); }
.trailer.cmt      { color: #1a9b7c; }
.trailer.err      { color: var(--c-err); }

/* ── Data panes ── */
.data-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.data-bar {
  flex-shrink: 0; display: flex; align-items: center; gap: 12px;
  padding: 6px 14px; background: var(--bg2); border-bottom: 1px solid var(--border);
  user-select: none;
}
.data-bar.hidden { display: none; }
.data-msg {
  flex: 1; font-size: 11px; color: var(--c-err);
  overflow-wrap: anywhere;             /* wrap the long url rather than clip it */
}
.data-src {
  color: #4aa8d8; text-decoration: none;
  transition: color .1s;
}
.data-src:hover { color: var(--c-ok); text-decoration: underline; }
.data-pane textarea {
  flex: 1; background: var(--bg); border: none; outline: none; color: #c8c8c8;
  font-family: 'Consolas', 'Courier New', monospace; font-size: 12px;
  line-height: 1.55; padding: 10px 14px; resize: none; white-space: pre;
}

/* Scrollbars */
::-webkit-scrollbar       { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #3d3d3d; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #565656; }
</style>
</head>
<body>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="editor" onclick="switchTab('editor')">Editor</button>
  <button class="tab" data-tab="weapons" onclick="switchTab('weapons')">
    Weapons <span class="tab-badge err" id="badge-weapons">✗</span>
  </button>
  <button class="tab" data-tab="body" onclick="switchTab('body')">
    Body <span class="tab-badge err" id="badge-body">✗</span>
  </button>
  <button class="tab" data-tab="propulsion" onclick="switchTab('propulsion')">
    Propulsion <span class="tab-badge err" id="badge-propulsion">✗</span>
  </button>
</div>

<div class="workspace">

  <!-- ── Editor ── -->
  <div class="pane active" id="pane-editor">
    <div class="editor-wrap">
      <div class="gutter-outer"><div id="gc"></div></div>
      <div class="ta-wrap">
        <div id="hl" aria-hidden="true"></div>
        <div id="mirror" aria-hidden="true"></div>
        <textarea id="ta" spellcheck="false" autocomplete="off"
                  autocorrect="off" autocapitalize="off"
                  placeholder='Paste TEMPLATES.js here, or type one template per line:
{ turrets: ["MG1Mk1"], body: "Body1REC", propulsion: "wheeled01" },
Use // to comment out a line — use null for a spacer entry'></textarea>
      </div>
    </div>
  </div>

  <!-- ── Data panes ── -->
  <div class="pane" id="pane-weapons">
    <div class="data-pane">
      <div class="data-bar" id="bar-weapons">
        <span class="data-msg" id="msg-weapons"></span>
      </div>
      <textarea id="data-weapons" spellcheck="false" autocomplete="off"
                placeholder='{ "MG1Mk1": { "name": "Machinegun", ... }, ... }'></textarea>
    </div>
  </div>

  <div class="pane" id="pane-body">
    <div class="data-pane">
      <div class="data-bar" id="bar-body">
        <span class="data-msg" id="msg-body"></span>
      </div>
      <textarea id="data-body" spellcheck="false" autocomplete="off"
                placeholder='{ "Body1REC": { "name": "Viper", ... }, ... }'></textarea>
    </div>
  </div>

  <div class="pane" id="pane-propulsion">
    <div class="data-pane">
      <div class="data-bar" id="bar-propulsion">
        <span class="data-msg" id="msg-propulsion"></span>
      </div>
      <textarea id="data-propulsion" spellcheck="false" autocomplete="off"
                placeholder='{ "wheeled01": { "name": "Wheels", ... }, ... }'></textarea>
    </div>
  </div>

</div>

<script>
'use strict';

// ── Stat data (pasted by the user, one tab each) ──────────────────────────────

const KINDS = ['weapons', 'body', 'propulsion'];
const LS = { editor: 'wz.tpl.editor', weapons: 'wz.tpl.weapons', body: 'wz.tpl.body', propulsion: 'wz.tpl.propulsion' };

const SRC_BASE = 'https://raw.githubusercontent.com/Warzone2100/warzone2100/refs/heads/master/data/mp/stats/';
const srcUrl = (kind) => SRC_BASE + kind + '.json';

// kind -> { names: {id: name}, error }   — names and error are exclusive
const DATA = {
  weapons:    { names: null, error: 'Missing data' },
  body:       { names: null, error: 'Missing data' },
  propulsion: { names: null, error: 'Missing data' },
};

// Accepts a bare JSON object, or an assignment like `WEAPONS_DATA = { … };`
function parseStats(src) {
  const t = src.trim();
  if (!t) return { names: null, error: 'Missing data' };

  const start = t.indexOf('{');
  const end   = t.lastIndexOf('}');
  if (start < 0 || end < start) return { names: null, error: 'No JSON object found' };

  let obj;
  try {
    obj = JSON.parse(t.slice(start, end + 1));
  } catch (e) {
    return { names: null, error: 'Invalid JSON — ' + e.message };
  }
  if (!obj || typeof obj !== 'object' || Array.isArray(obj))
    return { names: null, error: 'Expected an object keyed by ID' };

  const names = {};
  let n = 0;
  for (const [key, v] of Object.entries(obj)) {
    const id   = (v && typeof v === 'object' && v.id)   ? v.id   : key;
    const name = (v && typeof v === 'object' && v.name) ? v.name : null;
    if (!name) continue;
    names[id] = name;
    n++;
  }
  if (!n) return { names: null, error: 'No entries with a "name" field' };
  return { names, error: '' };
}

// The editor only ever reads `name`, so a pasted stat file is boiled down to that
function condensedSource(names) {
  const rows = Object.entries(names)
    .map(([id, name]) => `  ${JSON.stringify(id)}: { "name": ${JSON.stringify(name)} }`);
  return '{\n' + rows.join(',\n') + '\n}\n';
}

function loadData(kind) {
  const src = document.getElementById('data-' + kind).value;
  DATA[kind] = parseStats(src);
  renderDataStatus(kind);
}

function condense(kind) {
  if (!DATA[kind].names) return;   // a failed parse stays put, so it can be read and fixed
  const el   = document.getElementById('data-' + kind);
  const next = condensedSource(DATA[kind].names);
  if (el.value === next) return;
  el.value = next;
  el.scrollTop = 0;
  el.setSelectionRange(0, 0);
}

function renderDataStatus(kind) {
  const d     = DATA[kind];
  const badge = document.getElementById('badge-' + kind);
  const msg   = document.getElementById('msg-' + kind);
  const url   = srcUrl(kind);

  // the bar only earns its space while there is an error to report
  msg.textContent = '';
  if (d.error) {
    msg.append(d.error + ': Copy-paste from ');
    const a = document.createElement('a');
    a.className = 'data-src';
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = url;
    msg.append(a);
  }
  document.getElementById('bar-' + kind).classList.toggle('hidden', !d.error);

  badge.className   = 'tab-badge ' + (d.error ? 'err' : 'ok');
  badge.textContent = d.error ? '✗' : '✓';
}

const anyDataLoaded = () => KINDS.some(k => DATA[k].names);

// ── Line classification ───────────────────────────────────────────────────────
// type: 'empty' | 'frame' | 'null' | 'comment' | 'template'

function classifyLine(raw) {
  const t = raw.trim();
  if (!t)                                  return { type: 'empty',   body: '' };
  if (/^const\s+TEMPLATES\s*=\s*\[\s*$/.test(t)) return { type: 'frame', body: t };
  if (/^\]\s*;?\s*$/.test(t))              return { type: 'frame',   body: t };
  if (/^null\s*,?\s*$/.test(t))            return { type: 'null',    body: t };
  if (t.startsWith('//'))                  return { type: 'comment', body: t.slice(2).trim() };
  return                                          { type: 'template', body: t };
}

// ── Template parsing: search-and-replace, leftovers are an error ──────────────

function parseTemplate(src) {
  let rest = src.trim().replace(/,+\s*$/, '');

  if (!rest.startsWith('{') || !rest.endsWith('}'))
    return { error: 'not a { … } template' };
  rest = rest.slice(1, -1);

  const cut = (rx) => {
    const m = rest.match(rx);
    if (!m) return null;
    rest = rest.slice(0, m.index) + rest.slice(m.index + m[0].length);
    return m;
  };

  const tm = cut(/turrets\s*:\s*\[([^\]]*)\]/);
  const bm = cut(/body\s*:\s*"([^"]*)"/);
  const pm = cut(/propulsion\s*:\s*"([^"]*)"/);

  if (!tm) return { error: 'missing turrets' };
  if (!bm) return { error: 'missing body' };
  if (!pm) return { error: 'missing propulsion' };

  // Anything left beyond separators is an unrecognised token
  const leftover = rest.replace(/[,\s]+/g, ' ').trim();
  if (leftover) return { error: 'unexpected: ' + leftover };

  const turrets = [];
  const inner = tm[1].trim();
  if (inner) {
    for (const part of inner.split(',')) {
      const s = part.trim();
      if (!s) continue;
      const q = s.match(/^"([^"]*)"$/);
      if (!q) return { error: 'bad turret token: ' + s };
      turrets.push(q[1]);
    }
  }
  if (!turrets.length) return { error: 'no turrets' };

  const body = bm[1], propulsion = pm[1];
  if (!body)       return { error: 'empty body id' };
  if (!propulsion) return { error: 'empty propulsion id' };

  return { turrets, body, propulsion };
}

// Derive the friendly name: turret(s) + body + propulsion
function deriveName(tpl) {
  if (!anyDataLoaded()) return { name: '', error: '' };

  const missing = [];
  const lookup = (kind, id) => {
    const names = DATA[kind].names;
    if (!names) return null;               // that file simply isn't loaded yet
    if (!(id in names)) { missing.push(id); return null; }
    return names[id];
  };

  const parts = [];
  tpl.turrets.forEach(id => { const n = lookup('weapons', id); if (n) parts.push(n); });
  const b = lookup('body', tpl.body);             if (b) parts.push(b);
  const p = lookup('propulsion', tpl.propulsion); if (p) parts.push(p);

  if (missing.length) return { name: '', error: 'unknown id: ' + missing.join(', ') };
  return { name: parts.join(' '), error: '' };
}

let lineCache = {};

function getLineInfo(raw) {
  if (raw in lineCache) return lineCache[raw];

  const cls = classifyLine(raw);
  let info;

  if (cls.type === 'template' || cls.type === 'comment') {
    const looksTemplate = cls.body.trim().startsWith('{');
    if (cls.type === 'comment' && !looksTemplate) {
      info = { ...cls, tpl: null, name: '', error: '' };       // plain prose comment
    } else {
      const p = parseTemplate(cls.body);
      if (p.error) {
        info = { ...cls, tpl: null, name: '', error: p.error };
      } else {
        const d = deriveName(p);
        info = { ...cls, tpl: p, name: d.name, error: d.error };
      }
    }
  } else {
    info = { ...cls, tpl: null, name: '', error: '' };
  }

  lineCache[raw] = info;
  return info;
}

const invalidate = () => { lineCache = {}; };

// ── Rendering ─────────────────────────────────────────────────────────────────
// A DOM mirror sits behind the textarea holding the same text, laid out by the
// same engine under the same metrics (see the shared CSS rule). Nothing here
// measures text or computes an x offset: tabs, font fallback and wide glyphs
// land wherever the browser puts them, which is by construction wherever the
// caret thinks they are.

const ta     = document.getElementById('ta');
const mirror = document.getElementById('mirror');
const gc     = document.getElementById('gc');
const hl     = document.getElementById('hl');

// Read the line box off the stylesheet rather than restating it here — the
// caret-line band has to land on the same grid the text does.
const cssPx = (name) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
const LH   = cssPx('--lh');
const VPAD = cssPx('--vpad');

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };
const esc  = (s) => s.replace(/[&<>]/g, c => ESC[c]);
const span = (cls, text) => `<span class="${cls}">${esc(text)}</span>`;

const TOKEN_RX = /("(?:[^"\\]|\\.)*")|([A-Za-z_]\w*)\s*(?=:)|(\bnull\b)|([{}\[\],:])/g;

// Whitespace falls through as punct — colour is irrelevant, position is not, so
// it has to stay in the output verbatim.
function tokenize(text) {
  let out = '', last = 0, m;
  TOKEN_RX.lastIndex = 0;
  while ((m = TOKEN_RX.exec(text)) !== null) {
    if (m.index > last) out += span('t-punct', text.slice(last, m.index));
    if (m[1])      out += span('t-id',    m[1]);
    else if (m[2]) out += span('t-key',   m[0]);
    else if (m[3]) out += span('t-null',  m[3]);
    else           out += span('t-punct', m[4]);
    last = m.index + m[0].length;
  }
  if (last < text.length) out += span('t-punct', text.slice(last));
  return out;
}

const TRAILER_GAP = 3;                 // columns between the longest line and the names

function renderLine(raw, info, col) {
  let html;

  if (info.error && info.type !== 'comment') {
    html = span('t-err', raw);
  } else if (info.type === 'frame') {
    html = span('t-frame', raw);
  } else if (info.type === 'null') {
    html = span('t-null', raw);
  } else if (info.type === 'comment') {
    const i = raw.indexOf('//');
    html = esc(raw.slice(0, i))
         + span('t-slash', '//')
         + span(info.error ? 't-err' : 't-comment', raw.slice(i + 2));
  } else {
    html = tokenize(raw);
  }

  // Every trailer starts in the same column, so the gap is whatever this line
  // is short of the longest one, plus the standard separation.
  const text = info.error ? '◂ ' + info.error : info.name;
  if (text) {
    const gap = Math.max(col - raw.length, 0) + TRAILER_GAP;
    const cls = info.error ? 'err' : (info.type === 'comment' ? 'cmt' : 'ok');
    html += `<span class="trailer ${cls}" style="margin-left:${gap}ch">${esc(text)}</span>`;
  }

  return `<div class="ml">${html}</div>`;
}

function formatGutterTime(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return h > 0 ? `${h}:${String(m).padStart(2, '0')}:00` : `${m}:00`;
}

// One pass builds both columns, so a row can never appear in one and not the other.
function render() {
  const lines = ta.value.split('\n');
  const infos = lines.map(getLineInfo);
  const ml = [], gl = [];
  let count = 0;                       // only increments for real entries

  // The trailer column is set by the longest line that carries one; lines
  // without a trailer are free to run past it.
  let col = 0;
  for (let i = 0; i < lines.length; i++)
    if (infos[i].error || infos[i].name) col = Math.max(col, lines[i].length);

  for (let i = 0; i < lines.length; i++) {
    const raw  = lines[i];
    const info = infos[i];

    ml.push(renderLine(raw, info, col));

    const counts = info.type === 'template' || info.type === 'null';
    const num    = counts ? formatGutterTime(count) : '';
    if (counts) count++;

    gl.push(`<div class="gl${info.error ? ' err' : ''}${i === currentLine ? ' active' : ''}">`
          + `<span class="gnum">${num}</span><span class="gdot"></span></div>`);
  }

  mirror.innerHTML = ml.join('');
  gc.innerHTML     = gl.join('');
  syncScroll();
}

function syncScroll() {
  mirror.style.transform = `translate(${-ta.scrollLeft}px, ${-ta.scrollTop}px)`;
  gc.style.transform     = `translateY(${-ta.scrollTop}px)`;
  syncHighlight();
}

function syncHighlight() {
  hl.style.transform = `translateY(${VPAD + currentLine * LH - ta.scrollTop}px)`;
}

// ── Cursor tracking ───────────────────────────────────────────────────────────

let currentLine = 0;

function getCursorLine() {
  const before = ta.value.substring(0, ta.selectionStart);
  return (before.match(/\n/g) || []).length;
}

function refresh() {
  currentLine = getCursorLine();
  render();
}

ta.addEventListener('input', () => { invalidate(); save('editor'); refresh(); });
ta.addEventListener('scroll', syncScroll);

// Moving the caret only repaints two gutter rows — no need to rebuild anything.
document.addEventListener('selectionchange', () => {
  if (document.activeElement !== ta) return;
  const n = getCursorLine();
  if (n === currentLine) return;
  gc.children[currentLine]?.classList.remove('active');
  gc.children[n]?.classList.add('active');
  currentLine = n;
  syncHighlight();
});

// ── Tabs ──────────────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));

  if (name === 'editor') {
    invalidate();                    // stat data may have changed while away
    refresh();
    ta.focus();
  } else {
    document.getElementById('data-' + name).focus();
  }
}

// condense only on paste — rewriting on every keystroke would fight anyone editing by hand
const PASTE_INPUTS = new Set(['insertFromPaste', 'insertFromPasteAsQuotation', 'insertFromDrop']);

KINDS.forEach(kind => {
  const el = document.getElementById('data-' + kind);
  el.addEventListener('input', (e) => {
    loadData(kind);
    if (PASTE_INPUTS.has(e.inputType)) condense(kind);
    save(kind);
  });
});

// ── Persistence ───────────────────────────────────────────────────────────────

function save(which) {
  try {
    const el = which === 'editor' ? ta : document.getElementById('data-' + which);
    localStorage.setItem(LS[which], el.value);
  } catch (e) { /* storage full or blocked — not fatal */ }
}

function restore() {
  try {
    const ed = localStorage.getItem(LS.editor);
    if (ed) ta.value = ed;
    KINDS.forEach(k => {
      const v = localStorage.getItem(LS[k]);
      if (v) document.getElementById('data-' + k).value = v;
    });
  } catch (e) { /* ignore */ }
}

// ── Init ──────────────────────────────────────────────────────────────────────

restore();
KINDS.forEach(k => { loadData(k); condense(k); save(k); });   // shrinks anything stored full-size
refresh();
ta.focus();
</script>
</body>
</html>
